name: Chroma - Quality Gate

on:
  push:
    branches:
      - "preview/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, testes e QA visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build estatico e testes
        run: |
          npm run build
          npm test
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias QA
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright Pillow beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Teste real de navegacao via HTTP
        run: python tests/runtime_smoke.py
      - name: QA visual responsivo em 36 cenarios
        run: npm run qa:visual
      - name: Evidencias e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chroma-qa-visual
          path: qa/
          if-no-files-found: ignore
          retention-days: 14
