name: Chroma - Quality Gate

on:
  push:
    branches:
      - "preview/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, testes e QA visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build estatico e testes
        run: npm run validate
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias QA
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright Pillow beautifulsoup4
          if command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            echo "Usando navegador preinstalado no runner"
          else
            python -m playwright install chromium
          fi
      - name: Teste real de navegacao via HTTP
        run: python tests/runtime_smoke.py
      - name: QA visual responsivo em 36 cenarios
        run: npm run qa:visual
      - name: Evidencias e capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-qa-visual
          path: qa/
          if-no-files-found: ignore
          retention-days: 14
